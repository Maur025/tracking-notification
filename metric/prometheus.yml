    static_configs:
      - targets: ['172.20.50.60:7768']
    metrics_path: '/api/notifications/emails/queue/status'
  - job_name: 'whatsapp_metrics'
    static_configs:
      - targets: ['172.20.50.60:7768']
    metrics_path: '/api/notifications/whatsapp/queue/status'